
name: BotSentinel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run baseline training if dataset is available
        run: |
          if [ -f data/practice_dataset.csv ]; then
            python train.py --data data/practice_dataset.csv
          else
            echo "Dataset not present. Training skipped; dataset must be downloaded before CI training."
          fi

      - name: Run automated tests
        run: python -m pytest -v
